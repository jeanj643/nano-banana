<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nano[banana]</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #e8eae7;
      --white: #ffffff;
      --border: #d8dad6;
      --text: #1a1a1a;
      --text2: #6b6b6b;
      --text3: #aaaaaa;
      --radius: 14px;
      --radius-sm: 9px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .header-center { flex: 1; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text2);
      font-size: 15px;
      transition: background 0.15s;
    }

    .icon-btn:hover { background: rgba(0,0,0,0.07); }
    .icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── Layout ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      padding: 0 12px 12px 12px;
      gap: 10px;
    }

    /* ── Left Panel ── */
    .left-panel {
      width: 200px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-self: flex-start;
    }

    /* Reference images — 隐藏状态指示文字，只保留加载逻辑 */
    .ref-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
      display: none; /* 不展示 */
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* Upload zone */
    .upload-zone {
      background: var(--white);
      border-radius: var(--radius);
      border: 1.5px dashed var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px 40px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      gap: 12px;
      text-align: center;
    }

    .upload-zone:hover, .upload-zone.dragover {
      border-color: #999;
      background: #fafafa;
    }

    .upload-icon { font-size: 36px; opacity: 0.38; }

    .upload-title { font-size: 14px; color: var(--text2); line-height: 1.5; }

    .upload-formats { font-size: 12px; color: var(--text3); }

    /* Buttons */
    .bottom-btns {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      padding: 14px 4px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .action-btn:hover:not(:disabled) { opacity: 0.82; }
    .action-btn:active:not(:disabled) { transform: scale(0.97); }
    .action-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-light-style { background: #e2e4e0; color: #1a1a1a; }
    .btn-dark-style  { background: #1a1a1a; color: #ffffff; }

    /* ── Main canvas ── */
    .canvas {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow: hidden;
    }

    .canvas-drop {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text3);
      font-size: 13px;
      border-radius: var(--radius);
      transition: background 0.15s;
    }

    .canvas-drop.dragover { background: rgba(0,0,0,0.03); }

    .grid-scroll {
      flex: 1;
      overflow-y: auto;
      border-radius: var(--radius);
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      padding: 2px;
    }

    /* Card */
    .img-card {
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--white);
      position: relative;
      aspect-ratio: 1/1;
    }

    .img-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.35) 100%);
      opacity: 0;
      transition: opacity 0.18s;
      pointer-events: none;
      border-radius: var(--radius);
    }

    .img-card:hover .card-overlay { opacity: 1; }

    .card-top-actions {
      position: absolute;
      top: 7px;
      right: 7px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.18s;
      z-index: 5;
    }

    .img-card:hover .card-top-actions { opacity: 1; }

    .card-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(4px);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #1a1a1a;
      transition: background 0.12s;
    }

    .card-btn:hover { background: #fff; }
    .card-btn.red:hover { background: #ff4444; color: #fff; }

    .status-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-size: 10px;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 5px;
      backdrop-filter: blur(4px);
      z-index: 4;
    }

    .badge-pending    { background: rgba(255,255,255,0.7); color: #666; }
    .badge-processing { background: rgba(0,0,0,0.55); color: #fff; }
    .badge-done       { background: rgba(30,180,100,0.8); color: #fff; }
    .badge-error      { background: rgba(220,50,50,0.8); color: #fff; }

    .proc-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(2px);
      border-radius: var(--radius);
      z-index: 6;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(0,0,0,0.1);
      border-top-color: #1a1a1a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

    /* Toast */
    .toast-wrap {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 999;
      pointer-events: none;
    }

    .toast {
      background: rgba(26,26,26,0.88);
      color: #fff;
      font-size: 12.5px;
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox-img {
      max-width: min(800px, 88vw);
      max-height: 88vh;
      border-radius: 12px;
      object-fit: contain;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: lbIn 0.2s ease;
    }

    @keyframes lbIn {
      from { transform: scale(0.94); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .lightbox-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(6px);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      transition: background 0.15s;
      z-index: 2;
    }

    .lightbox-arrow:hover { background: rgba(255,255,255,0.28); }
    .lightbox-arrow.prev  { left: 20px; }
    .lightbox-arrow.next  { right: 20px; }

    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 20px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(6px);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      transition: background 0.15s;
    }

    .lightbox-close:hover { background: rgba(255,255,255,0.28); }

    .lightbox-counter {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      pointer-events: none;
    }

    /* ── Admin Panel ── */
    .admin-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .admin-overlay.open { display: flex; }
    .admin-panel {
      background: #fff;
      border-radius: 20px;
      width: min(640px, 92vw);
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 24px 64px rgba(0,0,0,0.18);
      display: flex;
      flex-direction: column;
    }
    .admin-header {
      padding: 24px 28px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .admin-title { font-size: 16px; font-weight: 700; color: #111; }
    .admin-close {
      width: 32px; height: 32px; border-radius: 50%;
      border: none; background: #f0f0f0; cursor: pointer;
      font-size: 14px; display: flex; align-items: center; justify-content: center;
      color: #555; transition: background 0.15s;
    }
    .admin-close:hover { background: #e0e0e0; }
    .admin-body { padding: 20px 28px 28px; display: flex; flex-direction: column; gap: 20px; }
    .admin-login-body { padding: 28px; display: flex; flex-direction: column; gap: 14px; align-items: stretch; }
    .admin-field { display: flex; flex-direction: column; gap: 7px; }
    .admin-label {
      font-size: 12px; font-weight: 600; color: #666; letter-spacing: 0.03em; text-transform: uppercase;
    }
    .admin-input {
      padding: 10px 14px; border: 1.5px solid #e0e0e0; border-radius: 10px;
      font-size: 13px; color: #111; outline: none; transition: border-color 0.15s;
      font-family: inherit; background: #fafafa;
    }
    .admin-input:focus { border-color: #111; background: #fff; }
    .admin-textarea {
      padding: 12px 14px; border: 1.5px solid #e0e0e0; border-radius: 10px;
      font-size: 12.5px; color: #111; outline: none; transition: border-color 0.15s;
      font-family: inherit; background: #fafafa; resize: vertical; min-height: 200px; line-height: 1.6;
    }
    .admin-textarea:focus { border-color: #111; background: #fff; }
    .admin-preview-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px;
    }
    .admin-preview-card {
      border-radius: 10px; overflow: hidden; border: 1.5px solid #e8e8e8;
      background: #f5f5f5; aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    }
    .admin-preview-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .admin-preview-label {
      font-size: 11px; color: #aaa; margin-top: 5px; text-align: center;
    }
    .admin-save-btn {
      padding: 12px; border-radius: 12px; border: none;
      background: #111; color: #fff; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s; margin-top: 4px;
    }
    .admin-save-btn:hover { opacity: 0.82; }
    .admin-save-tip {
      font-size: 12px; color: #4caf50; text-align: center;
      display: none; margin-top: -8px;
    }
    .admin-reset-btn {
      padding: 10px; border-radius: 12px; border: 1.5px solid #e0e0e0;
      background: transparent; color: #888; font-size: 13px;
      cursor: pointer; transition: all 0.15s;
    }
    .admin-reset-btn:hover { border-color: #bbb; color: #444; }
    .admin-divider { border: none; border-top: 1px solid #f0f0f0; margin: 0; }
    .admin-login-title { font-size: 15px; font-weight: 700; color: #111; text-align: center; }
    .admin-login-sub { font-size: 13px; color: #999; text-align: center; margin-top: -6px; }
    .admin-login-btn {
      padding: 12px; border-radius: 12px; border: none;
      background: #111; color: #fff; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
    }
    .admin-login-btn:hover { opacity: 0.82; }
    .admin-login-err { font-size: 12px; color: #e53935; text-align: center; display: none; }
  </style>
</head>
<body>

<header>
  <div class="header-center"></div>
  <div class="header-actions">
    <button class="icon-btn" id="btnClear" title="清空全部">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
      </svg>
    </button>
  </div>
</header>

<div class="layout">

  <!-- Left Panel -->
  <div class="left-panel">

    <!-- 隐藏的参考图元素，仅用于加载 base64 -->
    <img id="refImgSafety" src="https://fe-platform.xhscdn.com/platform/104101l031t29vrca620698hfn1qg00000000081m14ig0" crossorigin="anonymous" alt="" style="display:none" />
    <img id="refImgScene"  src="https://fe-platform.xhscdn.com/platform/104101l031t29vqjels0698hfn1qg00000000084tauajc" crossorigin="anonymous" alt="" style="display:none" />

    <!-- Upload zone -->
    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon">↑</div>
      <div class="upload-title">点击或拖入图片 / 文件夹</div>
      <div class="upload-formats">支持 JPG、PNG、WEBP</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none" />

    <!-- Action buttons -->
    <div class="bottom-btns">
      <button class="action-btn btn-dark-style" id="btnRun" disabled>批量生成</button>
      <button class="action-btn btn-dark-style" id="btnDownloadAll" disabled>下载全部</button>
    </div>

  </div>

  <!-- Main Canvas -->
  <div class="canvas">
    <div class="grid-scroll" id="gridScroll">
      <div class="canvas-drop" id="canvasDrop">
        <div style="font-size:32px;opacity:0.2">🖼</div>
        <div>上传商品图后开始生成</div>
      </div>
      <div class="image-grid" id="imageGrid" style="display:none"></div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<!-- Admin Overlay -->
<div class="admin-overlay" id="adminOverlay">

  <!-- Login view -->
  <div class="admin-panel" id="adminLoginView">
    <div class="admin-login-body">
      <div class="admin-login-title">管理面板</div>
      <div class="admin-login-sub">请输入访问密码</div>
      <input class="admin-input" id="adminPwdInput" type="password" placeholder="密码" />
      <div class="admin-login-err" id="adminLoginErr">密码错误，请重试</div>
      <button class="admin-login-btn" id="adminLoginBtn">进入</button>
    </div>
  </div>

  <!-- Main view -->
  <div class="admin-panel" id="adminMainView" style="display:none">
    <div class="admin-header">
      <span class="admin-title">管理面板</span>
      <button class="admin-close" id="adminCloseBtn">✕</button>
    </div>
    <div class="admin-body">

      <!-- Reference images -->
      <div class="admin-field">
        <div class="admin-label">安全区参考图 URL</div>
        <input class="admin-input" id="adminSafetyUrl" type="text" placeholder="https://..." />
      </div>
      <div class="admin-field">
        <div class="admin-label">场景参考图 URL</div>
        <input class="admin-input" id="adminSceneUrl" type="text" placeholder="https://..." />
      </div>

      <!-- Preview -->
      <div>
        <div class="admin-preview-row">
          <div>
            <div class="admin-preview-card" id="previewSafety">
              <span style="font-size:11px;color:#ccc">预览</span>
            </div>
            <div class="admin-preview-label">安全区参考图</div>
          </div>
          <div>
            <div class="admin-preview-card" id="previewScene">
              <span style="font-size:11px;color:#ccc">预览</span>
            </div>
            <div class="admin-preview-label">场景参考图</div>
          </div>
        </div>
      </div>

      <hr class="admin-divider" />

      <!-- Prompt -->
      <div class="admin-field">
        <div class="admin-label">生图关键词（Prompt）</div>
        <textarea class="admin-textarea" id="adminPrompt"></textarea>
      </div>

      <hr class="admin-divider" />

      <!-- API Config -->
      <div class="admin-field">
        <div class="admin-label">API URL</div>
        <input class="admin-input" id="adminApiUrl" type="text" placeholder="https://..." />
      </div>
      <div class="admin-field">
        <div class="admin-label">API Key</div>
        <input class="admin-input" id="adminApiKey" type="text" placeholder="your-api-key" />
      </div>

      <button class="admin-save-btn" id="adminSaveBtn">保存并生效</button>
      <div class="admin-save-tip" id="adminSaveTip">✓ 已保存，立即生效</div>
      <button class="admin-reset-btn" id="adminResetBtn">恢复默认值</button>

    </div>
  </div>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lbClose">✕</button>
  <button class="lightbox-arrow prev" id="lbPrev">&#8249;</button>
  <img class="lightbox-img" id="lbImg" src="" alt="" />
  <button class="lightbox-arrow next" id="lbNext">&#8250;</button>
  <div class="lightbox-counter" id="lbCounter"></div>
</div>

<script>
  // ─── Config ───────────────────────────────────────────
  // API_URL / API_KEY 由 CUR_API_URL / CUR_API_KEY 动态管理，见下方 localStorage 初始化

  const _DEFAULT_SAFETY_URL = 'https://fe-platform.xhscdn.com/platform/104101l031t29vrca620698hfn1qg00000000081m14ig0';
  const _DEFAULT_SCENE_URL  = 'https://fe-platform.xhscdn.com/platform/104101l031t29vqjels0698hfn1qg00000000084tauajc';
  const _DEFAULT_PROMPT = `你将收到三张图：第一张是安全区参考图（仅用于标示商品可摆放的区域范围，红框为尺寸参考辅助线，绝对不得出现在输出图中）；第二张是场景参考图（提供背景和环境）；第三张是用户上传的商品图。

请按照以下要求生成最终合成图片：
1. 输出图片为1024×1024像素的1:1正方形画幅，要求高清细腻，图像锐利无模糊
2. 【背景严格不变】完整、像素级保留场景参考图的背景，包括背景的颜色、色调、亮度、光照、氛围、纹理、饱和度均不得有任何改变；绝对不允许将背景变暗、变亮、变色或添加任何滤镜效果；仅将场景中原有的商品替换为用户上传的商品
3. 【商品填充规则——极为重要】必须对商品进行等比例缩放和角度调整，使商品的最大外轮廓尽量撑满安全区；商品最宽处或最高处应与安全区对应边界的间距不超过5px；绝对不允许商品看起来过小、悬浮在中央或留有大量空白；若商品形状特殊（如长形、扁形），优先保证最长轴方向紧贴安全区边界
4. 商品在安全区内居中放置，以常见的35度侧面视角呈现，不使用俯拍或仰拍；可合理调整商品的形态与角度以更好地填满安全区

  async function fetchImageAsBase64(url) {
    const resp = await fetch(url, { mode: 'cors' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const blob = await resp.blob();
    const mime = blob.type || 'image/jpeg';
    const b64  = await blobToBase64(blob);
    return [b64, mime];
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload  = () => {
        const r = reader.result;
        resolve(r.includes(',') ? r.split(',')[1] : r);
      };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function imgElementToBase64(imgId) {
    return new Promise((resolve, reject) => {
      const img = $(imgId);
      const tryConvert = () => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width  = img.naturalWidth  || 200;
          canvas.height = img.naturalHeight || 200;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
          resolve([dataUrl.split(',')[1], 'image/jpeg']);
        } catch (e) {
          reject(e);
        }
      };
      if (img.complete && img.naturalWidth) tryConvert();
      else {
        img.onload  = tryConvert;
        img.onerror = reject;
      }
    });
  }

    for (let i = 0; i < pending.length; i += concurrency) {

      const batch = pending.slice(i, i + concurrency);
      await Promise.all(batch.map(img => abortFlag ? Promise.resolve() : processImage(img)));

    abortFlag = false;
    updateRunBtn();

    const doneCount  = images.filter(i => i.status === 'done').length;

  async function processImage(img) {
    img.status    = 'processing';
    img.errorMsg  = null;
    img.duration  = null;
    img.startTime = Date.now();
    updateCard(img);

    // 每秒更新卡片 badge 上的实时计时
    if (cardTimers[img.id]) clearInterval(cardTimers[img.id]);
    cardTimers[img.id] = setInterval(() => {

      if (badge) {
        const secs = Math.floor((Date.now() - img.startTime) / 1000);

    }, 1000);

    try {
      const userB64  = await fileToBase64(img.file);
      const userMime = img.file.type || 'image/jpeg';

      const resp = await fetch(CUR_API_URL, {
        method: 'POST',
        headers: {
          'api-key': CUR_API_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          contents: [{
            role: 'user',
            parts: [
              { inlineData: { mimeType: safetyMime, data: safetyB64 } },
              { inlineData: { mimeType: sceneMime,  data: sceneB64  } },
              { inlineData: { mimeType: userMime,   data: userB64   } },
              { text: FIXED_PROMPT }
            ]
          }],
          generationConfig: {
            temperature: 1,
            maxOutputTokens: 32768,
            responseModalities: ['TEXT', 'IMAGE'],
            topP: 0.95

          safetySettings: [
            { category: 'HARM_CATEGORY_HATE_SPEECH',       threshold: 'OFF' },
            { category: 'HARM_CATEGORY_DANGEROUS_CONTENT', threshold: 'OFF' },
            { category: 'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold: 'OFF' },
            { category: 'HARM_CATEGORY_HARASSMENT',        threshold: 'OFF' }
          ]
        })
      });

      if (!resp.ok) {
        let msg = `HTTP ${resp.status}`;
        try { const j = await resp.json(); msg = j?.error?.message || msg; } catch(_){}
        throw new Error(msg);
      }

      const data    = await resp.json();
      const parts   = data?.candidates?.[0]?.content?.parts || [];
      const imgPart = parts.find(p => p.inlineData?.data);

      if (imgPart) {
        const mime    = imgPart.inlineData.mimeType || 'image/png';
        const rawUrl  = `data:${mime};base64,${imgPart.inlineData.data}`;
        img.resultUrl = await resizeTo800(rawUrl);
        img.status    = 'done';
      } else {
        const textPart = parts.find(p => p.text);
        throw new Error(textPart?.text?.slice(0, 80) || '未返回图片结果');
      }

    } catch (err) {
      img.status   = 'error';
      img.errorMsg = err.message;
    }

    // 停止计时，记录总耗时
    if (cardTimers[img.id]) { clearInterval(cardTimers[img.id]); delete cardTimers[img.id]; }
    img.duration = Math.floor((Date.now() - img.startTime) / 1000);

    updateCard(img);
  }

  // ─── Resize to 800×800 via canvas ────────────────────
  function resizeTo800(dataUrl) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const TARGET = 800;
        const canvas = document.createElement('canvas');
        canvas.width  = TARGET;
        canvas.height = TARGET;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        // 如果原图已经够大，直接裁到800；如果小则居中填充白底
        const scale = Math.min(TARGET / img.width, TARGET / img.height);
        const w = Math.round(img.width  * scale);
        const h = Math.round(img.height * scale);
        const x = Math.round((TARGET - w) / 2);
        const y = Math.round((TARGET - h) / 2);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, TARGET, TARGET);
        ctx.drawImage(img, x, y, w, h);
        resolve(canvas.toDataURL('image/png', 1.0));
      };
      img.src = dataUrl;
    });
  }
